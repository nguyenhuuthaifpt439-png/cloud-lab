version: '3.8'

services:
  # 1. Backend Service (Trỏ trực tiếp tới MongoDB Atlas)
  backend:
    image: nguyenhuuthai1511/mern-backend:1.0
    container_name: mern-backend-hub
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb+srv://admin:123123Aa@cluster0.eaue62x.mongodb.net/mern-db?retryWrites=true&w=majority

  # 2. Frontend Service (Khởi chạy trên port 3000)
  frontend:
    image: nguyenhuuthai1511/mern-frontend:1.0
    container_name: mern-frontend-hub
    ports:
      - "3000:5173"
    depends_on:
      - backend